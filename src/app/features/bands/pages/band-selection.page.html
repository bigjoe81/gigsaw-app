<ion-split-pane when="xs" contentId="main">
  <ion-menu contentId="band-selection-content" class="create-panel" side="end" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Crea una band</ion-title>
        <ion-buttons slot="end">
          <ion-button>
            <ion-icon slot="icon-only" name="close" (click)="closeCreatePanel()"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <form
        class="relative flex min-h-full flex-col px-7 pt-12 text-[#071434] md:px-12 md:pt-[52px]"
        (submit)="createBand(); $event.preventDefault()"
      >
        <button
          class="absolute right-7 top-7 border-0 bg-transparent text-[#56647d]"
          type="button"
          aria-label="Chiudi"
          (click)="closeCreatePanel()"
        >
          <ion-icon class="text-[30px]" aria-hidden="true" name="close"/>
        </button>

        <header>
          <h2 class="m-0 text-[29px] font-[850] leading-tight tracking-normal">Crea una band</h2>
          <p class="m-0 mt-2.5 text-lg leading-[1.35] text-[#4f5d79]">Bastano poche informazioni.<br/>Potrai completare
            tutto dopo.</p>
        </header>

        <app-daisy-steps
          ariaLabel="Creazione band"
          stepsClass="my-9 mb-[34px] w-full"
          [steps]="createSteps"
        />

        <section>
          <label class="mb-2.5 block text-base font-bold">Logo della band</label>
          <div class="flex items-center gap-5 md:gap-8">
            <div
              class="grid size-[126px] place-items-center rounded-lg border-2 border-dashed border-[#a8b5c9] text-[#5a6880]">
              <ion-icon class="text-[45px]" aria-hidden="true" name="image-outline"/>
            </div>
            <div>
              <button
                class="flex h-[54px] items-center gap-2.5 rounded-[7px] border border-[#d6dfed] bg-white px-[18px] text-base text-[#23324c]"
                type="button"
              >
                <ion-icon class="text-[26px]" aria-hidden="true" name="cloud-upload-outline"/>
                Carica immagine
              </button>
              <p class="text-[#4f5d79]">PNG o JPG, max 2MB</p>
            </div>
          </div>
        </section>

        <label class="mt-7 block">
          <span class="mb-2.5 block text-base font-bold">Nome della band</span>
          <app-daisy-input
            controlClass="h-14 rounded-[7px] border-[#c7d2e2]"
            [value]="createForm().name"
            (valueChange)="updateCreateName($event)"
          />
          @if (createFormTouched() && !createFormValid()) {
            <app-daisy-message tone="error" messageClass="mt-2">Inserisci il nome della band.</app-daisy-message>
          }
        </label>

        <label class="mt-7 block">
          <span class="mb-2.5 block text-base font-bold">Generi musicali</span>
          <app-daisy-select
            controlClass="min-h-28 rounded-[7px] border-[#c7d2e2]"
            [multiple]="true"
            [value]="createForm().genres"
            (valueChange)="updateCreateGenres($event)"
          >
            <option value="Blues">Blues</option>
            <option value="Rock'n'roll">Rock'n'roll</option>
            <option value="Jazz">Jazz</option>
            <option value="Funk">Funk</option>
          </app-daisy-select>
        </label>

        <label class="mt-7 block">
          <span class="mb-2.5 block text-base font-bold">Città</span>
          <app-daisy-input
            controlClass="h-14 rounded-[7px] border-[#c7d2e2]"
            [value]="createForm().city"
            (valueChange)="updateCreateCity($event)"
          />
        </label>

        <label class="mt-[26px] flex items-center gap-3 text-[#465573]">
          <app-daisy-checkbox
            controlClass="size-[26px] rounded-[5px]"
            [checked]="createForm().owner"
            (checkedChange)="updateCreateOwner($event)"
          />
          <span>Sono il referente della band</span>
        </label>

        @if (createError) {
          <app-daisy-message tone="error" messageClass="mt-4">{{ createError }}</app-daisy-message>
        }

        <footer
          class="-mx-7 mt-[58px] grid grid-cols-[1fr_1.7fr] gap-3.5 border-t border-[#d6dfed] px-7 py-7 shadow-[0_-10px_30px_rgba(30,45,75,.06)] md:-mx-12 md:px-12">
          <app-daisy-button buttonClass="h-[58px] rounded-md font-extrabold" tone="outline" type="button"
                            (click)="closeCreatePanel()">Annulla
          </app-daisy-button>
          <app-daisy-button buttonClass="h-[58px] rounded-md font-extrabold" tone="primary" type="submit"
                            [loading]="saving">Crea e continua
          </app-daisy-button>
        </footer>
      </form>
    </ion-content>
  </ion-menu>
  <div class="ion-page" id="band-selection-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding"> Tap the button in the toolbar to open the menu.</ion-content>
  </div>
