<ion-header class="selection-header">
  <ion-toolbar><ion-title>Le tue band</ion-title></ion-toolbar>
</ion-header>

<ion-content class="selection-content">
  <main class="selection-shell">
    <header class="topbar">
      <img class="brand-logo" src="assets/logo-hor.png" alt="GigSaw" />
      <button class="logout-button" type="button" aria-label="Esci" (click)="logout()">
        <span class="avatar">GP</span><span class="user-name">Giorgio</span>
        <ion-icon aria-hidden="true" name="log-out-outline" />
      </button>
    </header>

    <section class="page-heading">
      <div>
        <span class="eyebrow">Workspace</span>
        <h1>Scegli la tua band</h1>
        <p>Entra in uno spazio di lavoro oppure creane uno nuovo.</p>
      </div>
      <button class="create-button" type="button" (click)="openCreateModal()">
        <ion-icon aria-hidden="true" name="add" /> Crea una band
      </button>
    </section>

    @if (loading()) {
      <section class="state-panel" aria-live="polite">
        <span class="loading loading-spinner loading-lg text-primary"></span><p>Caricamento band…</p>
      </section>
    } @else if (error()) {
      <section class="state-panel">
        <app-daisy-message tone="error">{{ error() }}</app-daisy-message>
        <app-daisy-button tone="outline" type="button" (click)="load()">Riprova</app-daisy-button>
      </section>
    } @else {
      <section class="band-grid" aria-label="Le tue band">
        @for (band of bands(); track band.id; let first = $first) {
          <button class="band-card" [class.featured]="first" type="button" (click)="selectBand(band)">
            <span class="band-logo">
              @if (band.logo) { <img [src]="band.logo" [alt]="band.name" /> }
              @else { <ion-icon aria-hidden="true" name="musical-notes" /> }
            </span>
            <span class="band-info">
              <strong>{{ band.name }}</strong><small>{{ formatGenres(band) }}</small>
              <span class="band-meta">{{ band.membersCount || band.members?.length || 1 }} {{ (band.membersCount || band.members?.length || 1) === 1 ? 'membro' : 'membri' }}</span>
            </span>
            <span class="role-badge">{{ band.currentUserRole === 'ADMIN' ? 'Admin' : 'Musicista' }}</span>
            <span class="open-label">Apri workspace <span aria-hidden="true">→</span></span>
          </button>
        }

        <button class="new-band-card" type="button" (click)="openCreateModal()">
          <span class="add-icon"><ion-icon aria-hidden="true" name="add" /></span>
          <span><strong>Crea una nuova band</strong><small>Configura il workspace in pochi passaggi</small></span>
        </button>
      </section>
    }

    <button class="help-button" type="button" (click)="openOnboarding()"><ion-icon aria-hidden="true" name="help-circle-outline" /> Guida introduttiva</button>
  </main>
</ion-content>

<ion-modal #createBandModal class="create-band-modal" [isOpen]="createModalOpen()" [backdropDismiss]="true" (didDismiss)="closeCreateModal()">
  <ng-template>
    <app-band-create [embedded]="true" (cancelled)="closeCreateModal()" (created)="onBandCreated($event)" />
  </ng-template>
</ion-modal>
