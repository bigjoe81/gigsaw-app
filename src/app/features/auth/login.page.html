<section appAuthKeyboardScroll class="app-content [--padding-start:16px] [--padding-end:16px]" >
  <div class="mx-auto flex w-full max-w-[340px] min-w-0 flex-col gap-4">
    <div class="grid justify-items-center gap-[14px] py-2 text-center">
      <picture class="block w-full">
        <source media="(min-width: 768px)" srcset="assets/logo-hor.png" />
        <img
          class="mx-auto block h-auto w-[min(260px,70vw)] object-contain drop-shadow-[0_14px_28px_rgba(0,0,0,0.12)] md:w-[min(300px,48vw)]"
          src="assets/logo-vert.png"
          alt="GigSaw logo"
        />
      </picture>
      <p class="m-0 max-w-96 text-[0.95rem] text-[var(--ui-color-medium)] [overflow-wrap:anywhere]">
        La tua band, prove, concerti e scalette<br /><strong>in un solo posto.</strong>
      </p>
    </div>
    <form class="flex w-full flex-col gap-4" (submit)="submit(); $event.preventDefault()">
      <label class="grid min-w-0 gap-[7px] text-sm font-bold">
        <span>Email</span>
      <app-gigsaw-input
        aria-label="Email"
        inputMode="email"
        autocapitalize="off"
        [spellcheck]="false"
        [controlClass]="'min-h-12 font-normal ' + (touched() ? 'is-touched' : '')"
        [disabled]="loading"
        type="email"
        name="email"
        placeholder="es. mario.rossi@gmail.com"
        autocomplete="email"
        [value]="email()"
        [invalid]="touched() && !emailValid()"
        (valueChange)="updateEmail($event)"
      />
      </label>
      @if (touched() && !emailValid()) {
        <app-gigsaw-message tone="error" messageClass="mt-2">Inserisci una email valida.</app-gigsaw-message>
      }
      @if (error) {
        <app-gigsaw-message tone="error" messageClass="mt-2">{{ error }}</app-gigsaw-message>
      }
      <app-gigsaw-button buttonClass="w-full" type="submit" tone="primary" [loading]="loading">Invia codice</app-gigsaw-button>
    </form>
    <app-gigsaw-button buttonClass="mt-3 w-full" tone="outline" type="button" (click)="loginWithGoogle()">
      <img class="h-5 w-5 object-contain" src="assets/google-logo.png" alt="" aria-hidden="true" />
      Continua con Google
    </app-gigsaw-button>
    <a class="block w-full rounded-md whitespace-normal text-center" routerLink="/registrati" [queryParams]="{ returnUrl }">Non sei registrato? Crea un account</a>
  </div>
</section>
