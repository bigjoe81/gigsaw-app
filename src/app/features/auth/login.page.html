<ion-content class="ion-padding login-content" [fullscreen]="true">
  <div class="login-shell">
    <div class="login-brand">
      <picture>
        <source srcset="assets/logo-hor-dark.png" media="(prefers-color-scheme: dark)" />
        <img src="assets/logo-hor.png" alt="GigSaw logo" />
      </picture>
      <p class="login-brand-note">La tua band, prove, concerti e scalette<br /><strong>in un solo posto.</strong></p>
    </div>
    <form (submit)="submit(); $event.preventDefault()">
      <label class="block">
        <span class="mb-2 block text-sm font-bold">Email</span>
        <app-daisy-input
          type="email"
          name="email"
          placeholder="es. mario.rossi@gmail.com"
          autocomplete="email"
          [value]="email()"
          (valueChange)="updateEmail($event)"
        />
      </label>
      @if (touched() && !emailValid()) {
        <app-daisy-message tone="error" messageClass="mt-2">Inserisci una email valida.</app-daisy-message>
      }
      @if (error) {
        <app-daisy-message tone="error" messageClass="mt-2">{{ error }}</app-daisy-message>
      }
      <app-daisy-button buttonClass="mt-4 w-full" type="submit" tone="primary" [loading]="loading">Invia codice OTP</app-daisy-button>
    </form>
    <app-daisy-button buttonClass="mt-3 w-full" tone="outline" type="button" (click)="loginWithGoogle()">Continua con Google</app-daisy-button>
    <a class="btn btn-ghost mt-2 w-full" routerLink="/register">Crea account</a>
  </div>
</ion-content>
