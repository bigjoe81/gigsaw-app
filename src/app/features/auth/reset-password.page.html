<ion-header><ion-toolbar><ion-title>Nuova password</ion-title></ion-toolbar></ion-header>
<ion-content class="[--padding-start:16px] [--padding-end:16px] [--padding-top:16px] [--padding-bottom:16px]"><form class="mx-auto grid w-full max-w-lg gap-4" [formGroup]="form" (ngSubmit)="submit()"><ion-item><ion-label position="stacked">Email</ion-label><ion-input type="email" autocomplete="email" formControlName="email" /></ion-item><ion-item><ion-label position="stacked">Password</ion-label><ion-input type="password" autocomplete="new-password" formControlName="password" /></ion-item><ion-item><ion-label position="stacked">Conferma password</ion-label><ion-input type="password" autocomplete="new-password" formControlName="password_confirmation" /></ion-item>@if (success) {
<ion-note color="success">{{ success }}</ion-note>
}@if (error) {
<ion-note color="danger">{{ error }}</ion-note>
}<ion-button expand="block" class="mt-2" type="submit" [disabled]="loading">@if(loading){<ion-spinner name="crescent"/>}@else{Aggiorna password}</ion-button></form><ion-button class="mx-auto mt-3 block w-full max-w-lg" expand="block" fill="clear" routerLink="/accedi">Torna al login</ion-button></ion-content>
