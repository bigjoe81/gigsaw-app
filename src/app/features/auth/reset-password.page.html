<header class="page-header"><div class="navbar gap-3"><h1 class="grow text-xl">Nuova password</h1></div></header>
<section class="app-content [--padding-start:16px] [--padding-end:16px] [--padding-top:16px] [--padding-bottom:16px]"><form class="mx-auto grid w-full max-w-lg gap-4" [formGroup]="form" (ngSubmit)="submit()"><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Email</span><input class="input w-full" type="email" autocomplete="email" formControlName="email"  /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Password</span><input class="input w-full" type="password" autocomplete="new-password" formControlName="password"  /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Conferma password</span><input class="input w-full" type="password" autocomplete="new-password" formControlName="password_confirmation"  /></label>@if (success) {
<small class="text-sm text-success">{{ success }}</small>
}@if (error) {
<small class="text-sm text-error">{{ error }}</small>
}<button class="btn btn-primary mt-2" type="submit" [disabled]="loading">@if(loading){<span class="loading loading-spinner" role="status" aria-label="Caricamento"></span>}@else{Aggiorna password}</button></form><button class="btn btn-ghost mx-auto mt-3 block w-full max-w-lg" routerLink="/accedi" type="button">Torna al login</button></section>
