<ion-content class="ion-padding register-content" [fullscreen]="true">
  <div class="mx-auto w-full max-w-full pt-[8vh] md:w-[min(340px,48vw)] md:pt-0">
    <div class="grid justify-items-center gap-3.5 pt-2 pb-6">
      <img
        class="block h-auto w-[min(300px,48vw)] object-contain drop-shadow-[0_14px_28px_rgba(0,0,0,0.12)]"
        src="assets/logo-hor-dark.png"
        alt="GigSaw logo"
      />
      <p class="max-w-96 text-center text-[0.95rem] text-[var(--ion-color-medium)]">
        La tua band, prove, concerti e scalette<br /><strong>in un solo posto.</strong>
      </p>
    </div>
    <form class="w-full" (submit)="submit(); $event.preventDefault()">
      <label class="block">
        <span class="mb-2 block text-sm font-bold">Nome</span>
        <app-daisy-input
          name="name"
          autocomplete="name"
          [value]="name()"
          (valueChange)="updateName($event)"
        />
      </label>
      @if (touched() && !nameValid()) {
        <app-daisy-message tone="error" messageClass="mt-2">Inserisci il nome.</app-daisy-message>
      }

      <label class="mt-4 block">
        <span class="mb-2 block text-sm font-bold">Email</span>
        <app-daisy-input
          type="email"
          name="email"
          autocomplete="email"
          [value]="email()"
          (valueChange)="updateEmail($event)"
        />
      </label>
      @if (touched() && !emailValid()) {
        <app-daisy-message tone="error" messageClass="mt-2">Inserisci una email valida.</app-daisy-message>
      }

      @if (error) {
        <app-daisy-message tone="error" messageClass="mt-2">{{ error }}</app-daisy-message>
      }

      <app-daisy-button buttonClass="mt-4 w-full" type="submit" tone="primary" [loading]="loading">Invia codice OTP</app-daisy-button>
    </form>
    <a class="btn btn-ghost mt-2 w-full" routerLink="/accedi" [queryParams]="{ returnUrl }">Hai già un account? Accedi</a>
  </div>
</ion-content>
