<header class="page-header">
  <div class="navbar gap-3">
    <div class="flex items-center gap-2" slot="start"><button class="btn btn-ghost btn-square" defaultHref="../"  type="button" appBack>←</button></div>
    <h1 class="grow text-xl">Template setlist</h1>
    <div class="flex items-center gap-2" slot="end"><button class="btn btn-primary" [routerLink]="['nuovo']" type="button"><app-symbol name="add"  /></button></div>
  </div>
</header>
<section class="app-content">
  <button type="button" class="btn btn-ghost btn-sm m-3" aria-label="Aggiorna elenco" (click)="load()">↻ Aggiorna</button>
  @if (loading) {
    <app-gigsaw-list>
      @for (item of [1,2,3]; track item) {
        <app-gigsaw-list-item><div class="list-col-grow"><span class="skeleton block h-4 my-2" style="width:55%" ></span><span class="skeleton block h-4 my-2" style="width:35%" ></span></div></app-gigsaw-list-item>
      }
    </app-gigsaw-list>
  } @else if (error) {
    <div class="flex min-h-[55%] flex-col items-center justify-center gap-4 p-6 text-center"><app-symbol class="text-[44px] text-[var(--ui-color-medium)]" name="alert-circle"  /><span class=" text-error">{{ error }}</span><button class="btn btn-outline" (click)="load()" type="button">Riprova</button></div>
  } @else if (!templates.length) {
    <div class="flex min-h-[55%] flex-col items-center justify-center gap-4 p-6 text-center"><app-symbol class="text-[44px] text-[var(--ui-color-medium)]" name="library"  /><span>Nessun template presente.</span><button class="btn btn-primary" [routerLink]="['nuovo']" type="button">Crea template</button></div>
  } @else {
    <app-gigsaw-list>
      @for (template of templates; track template.id) {
        <app-gigsaw-list-item [interactive]="true" [routerLink]="[template.id]">
          <div class="list-col-grow">
            <h2>{{ template.name }}</h2>
            <p>{{ subtitle(template) }}</p>
          </div>
        </app-gigsaw-list-item>
      }
    </app-gigsaw-list>
  }
</section>
