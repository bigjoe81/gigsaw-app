<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="../" /></ion-buttons>
    <ion-title>Template setlist</ion-title>
    <ion-buttons slot="end"><ion-button [routerLink]="['nuovo']"><ion-icon slot="icon-only" name="add" /></ion-button></ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="load($event)"><ion-refresher-content /></ion-refresher>
  @if (loading) {
    <app-daisy-list>
      @for (item of [1,2,3]; track item) {
        <app-daisy-list-item><div class="list-col-grow"><ion-skeleton-text [animated]="true" style="width:55%" /><ion-skeleton-text [animated]="true" style="width:35%" /></div></app-daisy-list-item>
      }
    </app-daisy-list>
  } @else if (error) {
    <div class="state"><ion-icon name="alert-circle" /><ion-text color="danger">{{ error }}</ion-text><ion-button fill="outline" (click)="load()">Riprova</ion-button></div>
  } @else if (!templates.length) {
    <div class="state"><ion-icon name="library" /><ion-text>Nessun template presente.</ion-text><ion-button [routerLink]="['nuovo']">Crea template</ion-button></div>
  } @else {
    <app-daisy-list>
      @for (template of templates; track template.id) {
        <app-daisy-list-item [interactive]="true" [routerLink]="[template.id]">
          <div class="list-col-grow">
            <h2>{{ template.name }}</h2>
            <p>{{ subtitle(template) }}</p>
          </div>
        </app-daisy-list-item>
      }
    </app-daisy-list>
  }
</ion-content>
