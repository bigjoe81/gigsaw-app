<header class="page-header"><div class="navbar gap-3"><div class="flex items-center gap-2" slot="start"><app-gigsaw-button tone="unstyled" buttonClass="btn btn-ghost btn-square" defaultHref="../"  type="button" appBack><app-symbol name="arrow-back-outline" /></app-gigsaw-button></div><h1 class="grow text-xl">{{ editing ? 'Modifica sessione' : 'Nuova sessione' }}</h1><div class="flex items-center gap-2" slot="end"><app-gigsaw-button tone="unstyled" buttonClass="btn btn-primary" (click)="save()" [disabled]="saving" type="button">@if(saving){<span class="loading loading-spinner"  role="status" aria-label="Caricamento"></span>}@else{Salva}</app-gigsaw-button></div></div></header>
<section class="app-content"><form [formGroup]="form" (ngSubmit)="save()"><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Titolo *</span><app-gigsaw-input formControlName="title" /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Data *</span><app-gigsaw-datepicker formControlName="date" /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">ID brano</span><app-gigsaw-input type="number" formControlName="songId" /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Luogo</span><app-gigsaw-input formControlName="location" /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Numero take</span><app-gigsaw-input type="number" formControlName="takeNumber" /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">URL audio</span><app-gigsaw-input type="url" formControlName="audioUrl" /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Note</span><app-gigsaw-textarea formControlName="notes" /></label>@if (error) {
<small class="text-sm text-error p-4">{{ error }}</small>
}<app-gigsaw-button tone="unstyled" buttonClass="btn btn-primary m-4" type="submit" [disabled]="saving">Salva sessione</app-gigsaw-button></form></section>
