<header class="page-header"><div class="navbar gap-3"><div class="flex items-center gap-2" slot="start"><button class="btn btn-ghost btn-square" defaultHref="../"  type="button" appBack>←</button></div><h1 class="grow text-xl">{{ editing ? 'Modifica sessione' : 'Nuova sessione' }}</h1><div class="flex items-center gap-2" slot="end"><button class="btn btn-primary" (click)="save()" [disabled]="saving" type="button">@if(saving){<span class="loading loading-spinner"  role="status" aria-label="Caricamento"></span>}@else{Salva}</button></div></div></header>
<section class="app-content"><form [formGroup]="form" (ngSubmit)="save()"><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Titolo *</span><input class="input w-full" formControlName="title"  /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Data *</span><input class="input w-full" type="date" formControlName="date" /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">ID brano</span><input class="input w-full" type="number" formControlName="songId"  /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Luogo</span><input class="input w-full" formControlName="location"  /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Numero take</span><input class="input w-full" type="number" formControlName="takeNumber"  /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">URL audio</span><input class="input w-full" type="url" formControlName="audioUrl"  /></label><label class="ui-item flex items-center gap-3 py-3"><span class="ui-label">Note</span><textarea class="textarea w-full" formControlName="notes" ></textarea></label>@if (error) {
<small class="text-sm text-error p-4">{{ error }}</small>
}<button class="btn btn-primary m-4" type="submit" [disabled]="saving">Salva sessione</button></form></section>
