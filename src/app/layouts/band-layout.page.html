<ion-split-pane contentId="band-content" when="(min-width: 600px)" [class.menu-collapsed]="menuCollapsed()" (click)="handleLayoutClick($event)">
  <ion-menu contentId="band-content" menuId="band-menu">
    <ion-content>
      <header class="menu-brand">
        <img src="assets/logo-hor.png" alt="GigSaw" class="menu-brand__logo" />
      </header>

      <ion-list class="menu-nav" lines="none">
        @for (section of sections; track section.key) {
          <ion-menu-toggle [autoHide]="false">
            <ion-item
              [detail]="false"
              [routerLink]="sectionHref(section.key)"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: false }"
              [title]="section.label"
            >
              <ion-icon aria-hidden="true" slot="start" [name]="section.icon" />
              <ion-label>{{ section.label }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }
      </ion-list>

      <ion-list class="menu-footer" lines="none">
        <ion-menu-toggle [autoHide]="false">
          <ion-item [detail]="false" routerLink="/band" title="Cambia band">
            <ion-icon aria-hidden="true" slot="start" name="arrow-back-outline" />
            <ion-label>Cambia band</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="band-content" />
</ion-split-pane>
