<header class="page-header">
  <div class="navbar gap-3">
    <div class="flex items-center gap-2" slot="start"><button class="btn btn-ghost btn-square" defaultHref="../" type="button" appBack>←</button></div>
    <h1 class="grow text-xl">{{ config.singular }}</h1>
    <div class="flex items-center gap-2" slot="end">
      <button class="btn btn-primary" [routerLink]="['modifica']" type="button">Modifica</button>
      <button class="btn btn-primary btn-error" (click)="confirmDelete()" type="button">Elimina</button>
    </div>
  </div>
</header>
<section class="app-content bg-[var(--gigsaw-background)]">
  @if(loading()){
    <article class="card bg-base-200 border border-base-300 my-4 [--background:#101d30] border-[var(--gigsaw-border)]">
      <div class="card-body">
        <span class="skeleton block h-4 my-2" style="width:70%"></span>
        <span class="skeleton block h-4 my-2" style="width:90%"></span>
      </div>
    </article>
  } @else if(error()){
    <small class="text-sm text-error p-4" role="alert">{{ error() }}</small>
    <button class="btn btn-outline" (click)="load()" type="button">Riprova</button>
  } @else if(item()){
    <app-gigsaw-list listClass="mx-auto my-[34px] w-[min(760px,calc(100%-40px))] rounded-2xl border border-[var(--gigsaw-border)] bg-[#101d30] p-2 max-[600px]:mx-3 max-[600px]:my-5 max-[600px]:w-auto [&_.ui-item]:[--background:transparent] [&_.ui-item]:[--color:var(--gigsaw-text)] [&_.ui-item]:[--border-color:var(--gigsaw-border)] [&_.ui-item]:[--padding-start:14px] [&_.ui-item]:[--inner-padding-end:14px] [&_.ui-item]:min-h-[70px]">
      @for (field of config.fields; track field) {
        <app-gigsaw-list-item>
          <div class="min-w-0 flex-1">
            <p class="m-0 mb-[5px] text-xs font-bold uppercase tracking-[.04em] text-[var(--gigsaw-muted)]">{{field.label}}</p>
            <h2 class="m-0 !font-[750] text-[var(--gigsaw-text)]">{{ display(field.key) || '—' }}</h2>
          </div>
        </app-gigsaw-list-item>
      }
    </app-gigsaw-list>
  } @else {
    <small class="text-sm p-4">Record non trovato.</small>
  }
</section>
