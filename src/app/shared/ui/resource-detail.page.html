<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="../"/></ion-buttons>
    <ion-title>{{ config.singular }}</ion-title>
    <ion-buttons slot="end">
      <ion-button [routerLink]="['modifica']">Modifica</ion-button>
      <ion-button color="danger" (click)="confirmDelete()">Elimina</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="bg-[var(--gigsaw-background)]">
  @if(loading()){
    <ion-card class="[--background:#101d30] border-[var(--gigsaw-border)]">
      <ion-card-content>
        <ion-skeleton-text [animated]="true" style="width:70%"/>
        <ion-skeleton-text [animated]="true" style="width:90%"/>
      </ion-card-content>
    </ion-card>
  } @else if(error()){
    <ion-note class="p-4" color="danger" role="alert">{{ error() }}</ion-note>
    <ion-button fill="outline" (click)="load()">Riprova</ion-button>
  } @else if(item()){
    <app-gigsaw-list listClass="mx-auto my-[34px] w-[min(760px,calc(100%-40px))] rounded-2xl border border-[var(--gigsaw-border)] bg-[#101d30] p-2 max-[600px]:mx-3 max-[600px]:my-5 max-[600px]:w-auto [&_ion-item]:[--background:transparent] [&_ion-item]:[--color:var(--gigsaw-text)] [&_ion-item]:[--border-color:var(--gigsaw-border)] [&_ion-item]:[--padding-start:14px] [&_ion-item]:[--inner-padding-end:14px] [&_ion-item]:min-h-[70px]">
      @for (field of config.fields; track field) {
        <app-gigsaw-list-item>
          <div class="min-w-0 flex-1">
            <p class="m-0 mb-[5px] text-xs font-bold uppercase tracking-[.04em] text-[var(--gigsaw-muted)]">{{field.label}}</p>
            <h2 class="m-0 !font-[750] text-[var(--gigsaw-text)]">{{ display(field.key) || '—' }}</h2>
          </div>
        </app-gigsaw-list-item>
      }
    </app-gigsaw-list>
  } @else {
    <ion-note class="p-4">Record non trovato.</ion-note>
  }
</ion-content>
