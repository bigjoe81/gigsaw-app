name: Smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      # Keep the initial smoke-test rollout isolated from the application lockfile.
      # Once the suite grows into full E2E coverage, Playwright can become a normal devDependency.
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://app.gigsaw.it' }}
          GIGSAW_API_URL: ${{ vars.SMOKE_API_URL || 'https://api.gigsaw.it' }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-failures-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
